[project]
name = "rightsizer"
version = "0.1.0"
description = "Deterministic EKS right-sizing: container recommendations and node-group scale-in, with blockers."
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.scripts]
rightsizer = "rightsizer.cli:main"
rightsizer-export = "rightsizer.output.console:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Name the package explicitly: automatic discovery also finds `out/` (reports)
# and refuses to build a flat layout with two top-level candidates.
[tool.setuptools.packages.find]
include = ["rightsizer", "rightsizer.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
